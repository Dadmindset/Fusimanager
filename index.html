<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Liga-Simulator</title>
  <link rel="icon" href="bilder/logo.svg">
  <!-- Für "Zum Startbildschirm hinzufügen" auf dem Handy -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0e5a3a">
  <!-- Schriften von Google Fonts (ohne Internet werden Ersatzschriften benutzt) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@400;700;800;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Hier hinein zeichnet app.js alle Bildschirme -->
  <div id="app"></div>

  <!-- Reihenfolge ist wichtig: erst die Daten, dann die Logik, dann die Anzeige -->
  <script src="daten/laender.js"></script>
  <script src="daten/spielset.js"></script>
  <script src="daten/computer-pool.js"></script>
  <script src="js/einstellungen.js"></script>
  <script src="js/texte.js"></script>
  <script src="js/spiellogik.js"></script>
  <script src="js/app.js"></script>

  <!-- Offline-Modus: speichert alle Dateien auf dem Gerät (nur online über https, nicht per Doppelklick) -->
  <script>
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
